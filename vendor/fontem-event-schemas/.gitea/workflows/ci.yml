name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v4

      - name: pip install
        run: |
          pip install -e .
          pip install pytest

      - name: pytest
        run: pytest -v

      - name: schemas package shape
        # Catch the day someone adds a new schema and forgets to
        # register it in loader._EVENT_TYPE_CATEGORY.
        run: |
          python -c "
          import json, pathlib
          from fontem_event_schemas.loader import _EVENT_TYPE_CATEGORY
          shipped = {p.stem for p in pathlib.Path('v1').rglob('*.json')}
          registered = set(_EVENT_TYPE_CATEGORY)
          missing = shipped - registered
          assert not missing, f'unregistered schemas: {missing}'
          "

  analyze:
    needs: test
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.CI_READ_TOKEN }}

      - name: Install deps and generate coverage
        run: |
          pip install -e .
          pip install pytest pytest-cov
          pytest --cov=fontem_event_schemas --cov-report=xml:coverage.xml || true

      - uses: ./.fontem-ci/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
