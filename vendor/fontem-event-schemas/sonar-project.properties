sonar.projectKey=fontem-event-schemas
sonar.projectName=fontem-event-schemas

sonar.sources=fontem_event_schemas
sonar.tests=tests
sonar.test.inclusions=tests/**

sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

sonar.issue.ignore.multicriteria=pylintall,builderparams
sonar.issue.ignore.multicriteria.pylintall.ruleKey=external_pylint:*
sonar.issue.ignore.multicriteria.pylintall.resourceKey=**/*.py
# The typed builders mirror each event schema 1:1, so they legitimately
# carry one parameter per schema field (upsert_contract has 21). S107
# 'too many parameters' is a false positive for this flat-by-design shape.
sonar.issue.ignore.multicriteria.builderparams.ruleKey=python:S107
sonar.issue.ignore.multicriteria.builderparams.resourceKey=**/builders.py
